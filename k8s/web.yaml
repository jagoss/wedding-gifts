apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: wedding-gifts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: wedding-registry-web:local
          imagePullPolicy: Never
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://api:8080"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: wedding-gifts
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30081

